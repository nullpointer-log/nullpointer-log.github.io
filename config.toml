baseURL = 'https://nullpointer-log.github.io/'
languageCode = "ja"
defaultContentLanguage = "ja"  # デフォルト言語を日本語に
title = 'nullpointer-log'
theme = 'PaperMod'

[params]
    subtitle = "Embedded Systems / Computer Vision / IoT Engineering"
    mainSections = ["posts"]
    description = "Embedded Systems / Computer Vision / IoT Engineering。組み込みソフトウェアの実務経験とPython・画像処理の個人開発を紹介する技術ポートフォリオ。設計・実装・デバッグ・技術検証の記録を公開しています。"

  socialIcons = [
    { name = "github", url = "https://github.com/nullpointer-log" }
  ]

  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowPostListThumbnail = true
  FuseOpts = { isCaseSensitive = false, minMatchCharLength = 2, shouldSort = true }
  ShowSearch = true
  defaultTheme = "light"     # 常にライト

  # ユーザーによるテーマ切り替えボタンを非表示にする
  disableThemeToggle = true

  [params.assets]
    disableFingerprinting = true
    customCSS = ["/css/custom.css"]

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Experience"
  url = "/experience/"
  weight = 2

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 3

[[menu.main]]
  name = "Articles"
  url = "/posts/"
  weight = 4

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 5

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 6
